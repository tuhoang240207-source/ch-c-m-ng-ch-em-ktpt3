<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Mẹ Yêu Dấu 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Hiệu ứng cánh hoa rơi */
        .petal {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 150% 0 150% 0;
            animation: animatePetal 10s linear infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes animatePetal {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                top: 110%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* Thẻ Container chính */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.15);
            text-align: center;
            max-width: 550px;
            width: 100%;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 2px solid #ffffff;
            animation: fadeIn 1.2s ease-in-out;
        }

        .heart-icon {
            font-size: 55px;
            color: #e91e63;
            margin-bottom: 10px;
            display: inline-block;
            animation: beat 1.1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.18); }
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-weight: 600;
            color: #8e24aa;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .btn-open {
            background: linear-gradient(45deg, #ec407a, #ab47bc);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.35);
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.5);
        }

        /* Khung nội dung lời chúc */
        .letter-content {
            display: none;
            margin-top: 25px;
            text-align: left;
            line-height: 1.8;
            color: #37474f;
            background: #fff5f8;
            padding: 22px;
            border-radius: 16px;
            border-left: 5px solid #ec407a;
            animation: slideDown 0.8s ease-out forwards;
        }

        .typing-text {
            font-size: 15px;
            white-space: pre-wrap;
        }

        .footer-text {
            text-align: right;
            font-weight: bold;
            color: #d81b60;
            margin-top: 15px;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Nhạc nền nhẹ nhàng -->
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
    </audio>

    <div class="card-container">
        <div class="heart-icon">💖</div>
        <h1>HAPPY BIRTHDAY</h1>
        <div class="subtitle">Chúc Mừng Sinh Nhật Mẹ Yêu Dấu 🌸</div>

        <button class="btn-open" id="btn-toggle" onclick="toggleLetter()">Bấm Vào Đây Để Mở Thư ✉️</button>

        <div class="letter-content" id="letter">
            <div class="typing-text" id="typewriter"></div>
            <div class="footer-text">— Con yêu Mẹ rất nhiều! ❤️ —</div>
        </div>
    </div>

    <script>
        const message = "Gửi Mẹ yêu dấu của con,\n\nNhân ngày sinh nhật Mẹ, con xin kính chúc Mẹ luôn dồi dào sức khỏe, lúc nào cũng an nhiên, vui vẻ và tràn ngập hạnh phúc bên gia đình.\n\nCảm ơn Mẹ vì đã luôn hy sinh, yêu thương và là điểm tựa vững chắc nhất cho con. Chúc Mẹ một tuổi mới thật nhiều may mắn và luôn bình an! 🌸✨";

        let isOpened = false;
        let charIndex = 0;

        function typeEffect() {
            if (charIndex < message.length) {
                document.getElementById("typewriter").textContent += message.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 40);
            }
        }

        function toggleLetter() {
            var letter = document.getElementById("letter");
            var music = document.getElementById("bg-music");
            var btn = document.getElementById("btn-toggle");

            if (!isOpened) {
                letter.style.display = "block";
                music.play().catch(e => console.log("Audio play blocked"));
                typeEffect();
                btn.textContent = "Thu Gọn Thư 💌";
                isOpened = true;
            } else {
                if (letter.style.display === "none") {
                    letter.style.display = "block";
                    btn.textContent = "Thu Gọn Thư 💌";
                } else {
                    letter.style.display = "none";
                    btn.textContent = "Bấm Vào Đây Để Mở Thư ✉️";
                }
            }
        }

        // Tạo hiệu ứng cánh hoa rơi
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 10000);
        }

        setInterval(createPetal, 350);
    </script>
</body>
</html>
